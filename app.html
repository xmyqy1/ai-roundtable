<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 圆桌</title>
<script src="errors.js"></script>
<script src="marked.min.js"></script>
<script src="purify.min.js"></script>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --line: #e3e2dc; --text: #1f1f1c; --muted: #6d6c66;
  --accent: #c2602f; --accent-soft: #f6e7de; --danger: #b3261e; --judge: #2f6f4f; --judge-soft: #e3f1e8;
  --user-soft: #e8eef8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1a1a18; --panel: #232321; --line: #3a3934; --text: #ecebe6; --muted: #a09e96;
    --accent: #e08458; --accent-soft: #3b2a21; --danger: #f08a80; --judge: #7cc49a; --judge-soft: #1f3328; --user-soft: #26303f; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--danger); }
button.small { padding: 2px 8px; font-size: 13px; }
input, select, textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; }
textarea { resize: vertical; }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
.app { display: flex; height: 100vh; }
.side { width: 250px; flex-shrink: 0; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
.side .top { padding: 14px; display: grid; gap: 8px; }
.side h1 { font-size: 18px; margin: 0 0 4px; }
.history { flex: 1; overflow-y: auto; padding: 0 8px; }
.history .item { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.history .item:hover, .history .item.active { background: var(--accent-soft); }
.history .item .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.history .item .x { opacity: 0; border: none; background: none; padding: 0 4px; }
.history .item:hover .x { opacity: .6; }
.side .bottom { padding: 12px 14px; border-top: 1px solid var(--line); }
.main { flex: 1; overflow-y: auto; }
.wrap { max-width: 880px; margin: 0 auto; padding: 24px 20px 120px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
.row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 120px; }
.row > .fit { flex: 0 0 auto; min-width: 0; }
.muted { color: var(--muted); font-size: 13px; }
.msg { border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--accent)); }
.msg .who { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.msg .who .meta { font-weight: 400; color: var(--muted); font-size: 12px; }
.msg.user { background: var(--user-soft); border-left-color: #5b7fbf; }
.msg.fact { background: var(--user-soft); border-left-color: #b8862b; }
.msg.judge { background: var(--judge-soft); border-left-color: var(--judge); }
.msg.error .body { color: var(--danger); }
.msg .body { overflow-wrap: anywhere; }
.msg .body p:first-child { margin-top: 4px; }
.msg .body p:last-child { margin-bottom: 0; }
.msg .body pre { background: var(--bg); padding: 10px; border-radius: 8px; overflow-x: auto; }
.msg .body table { border-collapse: collapse; } .msg .body td, .msg .body th { border: 1px solid var(--line); padding: 4px 8px; }
.round { text-align: center; color: var(--muted); font-size: 13px; margin: 18px 0 10px; }
.cursor::after { content: "▋"; animation: blink 1s steps(1) infinite; color: var(--accent); }
@keyframes blink { 50% { opacity: 0; } }
.part { display: grid; grid-template-columns: 1.2fr 1fr 1.4fr auto; gap: 8px; align-items: start; margin-bottom: 8px; }
.part textarea { min-height: 38px; height: 38px; }
.composer { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding-top: 20px; }
.composer .box { display: flex; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.composer textarea { border: none; background: transparent; min-height: 44px; }
.model { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.tag { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.manual { margin-top: 8px; display: grid; gap: 8px; }
.manual pre { white-space: pre-wrap; max-height: 220px; overflow-y: auto; background: var(--bg); padding: 10px; border-radius: 8px; font-size: 13px; margin: 0; }
.qcard { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--user-soft); border: 1px solid var(--line); }
.qcard input { max-width: 340px; }
.warn { color: var(--danger); font-size: 13px; }
.sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.site { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.site textarea { font: 12px/1.4 ui-monospace, Consolas, monospace; }
@media (max-width: 760px) {
  .app { flex-direction: column; height: auto; }
  .side { width: 100%; border-right: none; border-bottom: 1px solid var(--line); }
  .history { max-height: 160px; }
  .part { grid-template-columns: 1fr; }
  .model { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="top">
      <h1>🪑 AI 圆桌</h1>
      <button class="primary" id="btnNewDebate">＋ 新的圆桌讨论</button>
          </div>
    <div class="history" id="history"></div>
    <div class="bottom"><button id="btnSettings" style="width:100%">⚙️ 网站设置</button></div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<script src="sites.js"></script>
<script src="app.js"></script>
</body>
</html>
